<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Engine Attendance System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0e14;
    --bg-secondary: #10161d;
    --bg-card: #151c24;
    --accent: #2ec866;
    --accent-bright: #3ee97e;
    --accent-dim: rgba(46, 200, 102, 0.12);
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-dim: #5a6572;
    --border: #232b34;
    --border-bright: #2ec86644;
    --danger: #f85149;
    --danger-dim: rgba(248, 81, 73, 0.12);
    --warning: #d29922;
    --warning-dim: rgba(210, 153, 34, 0.12);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-primary);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(46,200,102,0.06) 0%, transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(46,200,102,0.04) 0%, transparent 40%);
    color: var(--text-primary);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  header {
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  header .prompt { color: var(--accent); font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: 0.2px; }
  header .cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent); margin-left: 2px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  main { max-width: 480px; margin: 0 auto; padding: 20px 16px; }

  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
  .card-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim);
    margin: 0 0 12px 0; display: flex; align-items: center; gap: 6px;
  }
  .card-title::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }

  label { font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 6px; }

  select, input[type=text], input[type=password] {
    width: 100%; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-primary); font-size: 15px; font-family: 'JetBrains Mono', monospace;
  }
  select {
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b949e' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 12px center; background-size: 18px;
  }
  select:focus, input:focus { outline: none; border-color: var(--accent); }
  .field { margin-bottom: 12px; }

  button {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
    border: none; border-radius: 8px; padding: 12px 18px; cursor: pointer; transition: all 0.15s ease;
  }
  .btn-primary { background: var(--accent); color: #05130a; width: 100%; }
  .btn-primary:hover { background: var(--accent-bright); }
  .btn-primary:disabled { background: #2a3138; color: var(--text-dim); cursor: not-allowed; }
  .btn-secondary { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--text-secondary); color: var(--text-primary); }
  .btn-danger-outline { background: transparent; color: var(--danger); border: 1px solid var(--danger-dim); font-size: 12px; padding: 6px 12px; }
  .btn-danger-outline:hover { background: var(--danger-dim); }
  .btn-link { background: transparent; color: var(--accent); padding: 4px 8px; font-size: 12px; text-decoration: underline; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row button { flex: 1; }
  .btn-row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }

  #topBar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--text-secondary);
  }
  #topBar b { color: var(--accent); }

  #loginError { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 16px; }

  #activeBanner {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
    background: var(--accent-dim); border: 1px solid var(--border-bright); border-radius: var(--radius); margin-bottom: 16px;
  }
  #activeBanner .label { font-size: 13px; color: var(--text-secondary); }
  #activeBanner .session { color: var(--accent); font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  #counter { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--accent); font-size: 15px; }

  #reader { border-radius: 8px; overflow: hidden; margin: 14px 0; border: 1px solid var(--border); }
  .divider { text-align: center; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 14px 0; }
  #fileInput { display: none; }

  #result {
    margin-top: 14px; padding: 14px; border-radius: 8px; font-size: 14px; font-weight: 600;
    min-height: 20px; font-family: 'JetBrains Mono', monospace; border: 1px solid var(--border);
  }
  .idle { background: var(--bg-secondary); color: var(--text-secondary); }
  .success { background: var(--accent-dim); color: var(--accent-bright); border-color: var(--border-bright); }
  .warning { background: var(--warning-dim); color: var(--warning); border-color: rgba(210,153,34,0.3); }
  .error { background: var(--danger-dim); color: var(--danger); border-color: rgba(248,81,73,0.3); }

  #queueNote { font-size: 12px; color: var(--warning); margin-top: 10px; }

  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-main { flex: 1; min-width: 0; }
  .history-text { font-size: 13px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-meta { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .badge {
    font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; text-transform: uppercase;
    letter-spacing: 0.5px; white-space: nowrap; font-family: 'JetBrains Mono', monospace;
  }
  .badge-success { background: var(--accent-dim); color: var(--accent-bright); }
  .badge-warning { background: var(--warning-dim); color: var(--warning); }
  .badge-error { background: var(--danger-dim); color: var(--danger); }
  #emptyHistory, #emptyLog { color: var(--text-dim); font-size: 13px; text-align: center; padding: 10px 0; }
  #logMeta { font-size: 11px; color: var(--text-dim); margin-top: 10px; text-align: center; }

  .hidden { display: none !important; }
  footer { text-align: center; color: var(--text-dim); font-size: 11px; font-family: 'JetBrains Mono', monospace; margin-top: 30px; }
</style>
</head>
<body>

<header>
  <span class="prompt">&gt;_</span>
  <h1>Project Engine Attendance System<span class="cursor"></span></h1>
</header>

<div id="topBar" class="hidden">
  Logged in as <b id="topBarName">—</b>
  <button id="logoutBtn" class="btn-link">logout</button>
</div>

<main>

  <!-- Login -->
  <div class="card" id="loginCard">
    <p class="card-title">Admin Login</p>
    <div class="field">
      <label for="loginUser">Username</label>
      <input type="text" id="loginUser" autocomplete="username">
    </div>
    <div class="field">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" autocomplete="current-password">
    </div>
    <button id="loginBtn" class="btn-primary">Log In</button>
    <div id="loginError"></div>
  </div>

  <!-- Session selection -->
  <div class="card hidden" id="sessionCard">
    <p class="card-title">Session</p>
    <label for="sessionSelect">Choose the session for this scan</label>
    <select id="sessionSelect"></select>
    <div class="btn-row">
      <button id="confirmBtn" class="btn-primary">Confirm &amp; Continue</button>
    </div>
  </div>

  <!-- Active session bar -->
  <div id="activeBanner" class="hidden">
    <span class="label">Marking <span class="session" id="activeSessionLabel">Session 1</span> — <span id="counter">–/–</span> present</span>
    <button id="changeSessionBtn" class="btn-link">change</button>
  </div>

  <!-- Scanner -->
  <div class="card hidden" id="scanCard">
    <p class="card-title">Scanner</p>
    <div class="btn-row">
      <button id="startBtn" class="btn-primary">Start Camera</button>
      <button id="stopBtn" class="btn-secondary hidden">Stop</button>
    </div>
    <div id="reader"></div>
    <div class="divider">or</div>
    <button id="uploadBtn" class="btn-secondary" style="width:100%;">Upload QR Image</button>
    <input type="file" id="fileInput" accept="image/*">
    <div id="result" class="idle">Waiting to scan...</div>
    <div id="queueNote" class="hidden"></div>
  </div>

  <!-- Local recent scans -->
  <div class="card hidden" id="localHistoryCard">
    <p class="card-title">Recent Scans <span style="color:var(--text-dim); font-weight:400; text-transform:none; letter-spacing:normal;">(this device)</span></p>
    <div id="historyList"></div>
    <div id="emptyHistory">No scans yet.</div>
    <div class="btn-row">
      <button id="clearHistoryBtn" class="btn-danger-outline" style="width:100%;">Clear Local History</button>
    </div>
  </div>

  <!-- Server-side filterable log -->
  <div class="card hidden" id="serverLogCard">
    <p class="card-title">Attendance Log <span style="color:var(--text-dim); font-weight:400; text-transform:none; letter-spacing:normal;">(all admins, saved in sheet)</span></p>

    <div class="btn-row-2col">
      <div class="field">
        <label for="filterSession">Session</label>
        <select id="filterSession"><option value="">All</option></select>
      </div>
      <div class="field">
        <label for="filterStatus">Status</label>
        <select id="filterStatus">
          <option value="">All</option>
          <option value="Present">Present</option>
          <option value="Already Present">Already Present</option>
          <option value="Not Found">Not Found</option>
        </select>
      </div>
    </div>
    <div class="btn-row-2col">
      <div class="field">
        <label for="filterAdmin">Admin</label>
        <input type="text" id="filterAdmin" placeholder="e.g. sara">
      </div>
      <div class="field">
        <label for="filterStudent">Student (ID or name)</label>
        <input type="text" id="filterStudent" placeholder="e.g. S001">
      </div>
    </div>
    <button id="loadLogBtn" class="btn-primary">Load Log</button>

    <div id="logList" style="margin-top:12px;"></div>
    <div id="emptyLog" class="hidden">No matching scans.</div>
    <div id="logMeta"></div>
  </div>

</main>

<footer>Project Engine Attendance System</footer>

<script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
<script>
  // ============================================================
  // CONFIG — paste your Apps Script Web App URL here (ends in /exec)
  // ============================================================
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3J7Fvmq-CvvZWFuVG221GqldkFI-T41jXUf6oF7UDWXlqeojuuGaIIPPO5l5Z9Z9S/exec";
  // ============================================================

  const SESSIONS = 14;
  const QUEUE_KEY = 'attendanceOfflineQueue';
  const HISTORY_KEY = 'attendanceScanHistory';
  const HISTORY_LIMIT = 50;
  const ADMIN_KEY = 'attendanceAdmin';

  // ---- Elements ----
  const topBar = document.getElementById('topBar');
  const topBarName = document.getElementById('topBarName');
  const logoutBtn = document.getElementById('logoutBtn');

  const loginCard = document.getElementById('loginCard');
  const loginUser = document.getElementById('loginUser');
  const loginPass = document.getElementById('loginPass');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');

  const sessionCard = document.getElementById('sessionCard');
  const sessionSelect = document.getElementById('sessionSelect');
  const confirmBtn = document.getElementById('confirmBtn');

  const activeBanner = document.getElementById('activeBanner');
  const activeSessionLabel = document.getElementById('activeSessionLabel');
  const changeSessionBtn = document.getElementById('changeSessionBtn');
  const counterSpan = document.getElementById('counter');

  const scanCard = document.getElementById('scanCard');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const uploadBtn = document.getElementById('uploadBtn');
  const fileInput = document.getElementById('fileInput');
  const resultDiv = document.getElementById('result');
  const queueNote = document.getElementById('queueNote');

  const localHistoryCard = document.getElementById('localHistoryCard');
  const historyList = document.getElementById('historyList');
  const emptyHistory = document.getElementById('emptyHistory');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');

  const serverLogCard = document.getElementById('serverLogCard');
  const filterSession = document.getElementById('filterSession');
  const filterStatus = document.getElementById('filterStatus');
  const filterAdmin = document.getElementById('filterAdmin');
  const filterStudent = document.getElementById('filterStudent');
  const loadLogBtn = document.getElementById('loadLogBtn');
  const logList = document.getElementById('logList');
  const emptyLog = document.getElementById('emptyLog');
  const logMeta = document.getElementById('logMeta');

  // Populate session dropdowns (1..14)
  for (let s = 1; s <= SESSIONS; s++) {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = 'Session ' + s;
    sessionSelect.appendChild(opt);

    const opt2 = document.createElement('option');
    opt2.value = s; opt2.textContent = 'Session ' + s;
    filterSession.appendChild(opt2);
  }
  sessionSelect.value = localStorage.getItem('attendanceLastSession') || '1';

  let confirmedSession = null;
  let presentCount = 0, totalCount = 0;
  let lastCode = '', lastTime = 0;
  const html5QrCode = new Html5Qrcode("reader");
  let cameraRunning = false;

  function showResult(cls, text) { resultDiv.className = cls; resultDiv.textContent = text; }

  function checkConfigured() {
    if (!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
      loginError.textContent = 'SCRIPT_URL is not set in scanner.html — edit the CONFIG section at the top of the file.';
      loginBtn.disabled = true;
      return false;
    }
    return true;
  }

  function apiCall(payload) {
    return fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (res) { return res.json(); });
  }

  // ---- Admin session ----
  function getAdmin() {
    try { return JSON.parse(sessionStorage.getItem(ADMIN_KEY)); } catch (e) { return null; }
  }
  function setAdmin(admin) { sessionStorage.setItem(ADMIN_KEY, JSON.stringify(admin)); }
  function clearAdmin() { sessionStorage.removeItem(ADMIN_KEY); }

  function showLoggedInUI(admin) {
    topBarName.textContent = admin.name;
    topBar.classList.remove('hidden');
    loginCard.classList.add('hidden');
    sessionCard.classList.remove('hidden');
    localHistoryCard.classList.remove('hidden');
    serverLogCard.classList.remove('hidden');
    renderHistory();
  }

  function showLoggedOutUI() {
    topBar.classList.add('hidden');
    loginCard.classList.remove('hidden');
    [sessionCard, activeBanner, scanCard, localHistoryCard, serverLogCard].forEach(function (el) {
      el.classList.add('hidden');
    });
  }

  loginBtn.addEventListener('click', function () {
    if (!checkConfigured()) return;
    const username = loginUser.value.trim();
    const password = loginPass.value;
    if (!username || !password) { loginError.textContent = 'Enter a username and password.'; return; }

    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Checking...';

    apiCall({ action: 'login', username: username, password: password })
      .then(function (res) {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
        if (res.ok) {
          setAdmin({ username: res.username, name: res.name });
          loginPass.value = '';
          showLoggedInUI(res);
        } else {
          loginError.textContent = res.message || 'Login failed.';
        }
      })
      .catch(function () {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
        loginError.textContent = 'Could not reach the server. Check your connection.';
      });
  });

  logoutBtn.addEventListener('click', function () {
    if (cameraRunning) { html5QrCode.stop().catch(function () {}); cameraRunning = false; }
    clearAdmin();
    confirmedSession = null;
    showLoggedOutUI();
  });

  // ---- Local scan history ----
  function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch (e) { return []; } }
  function saveHistoryList(list) { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }
  function addHistoryEntry(entry) {
    const list = getHistory();
    list.unshift(entry);
    while (list.length > HISTORY_LIMIT) list.pop();
    saveHistoryList(list);
    renderHistory();
  }
  function badgeClass(status) {
    if (status === 'success') return 'badge-success';
    if (status === 'warning') return 'badge-warning';
    return 'badge-error';
  }
  function badgeLabel(entry) {
    if (entry.status === 'success') return 'present';
    if (entry.status === 'warning') return entry.queued ? 'queued' : 'dup';
    return 'error';
  }
  function renderHistory() {
    const list = getHistory();
    historyList.innerHTML = '';
    emptyHistory.classList.toggle('hidden', list.length > 0);
    list.forEach(function (entry) {
      const row = document.createElement('div');
      row.className = 'history-item';
      const main = document.createElement('div');
      main.className = 'history-main';
      const text = document.createElement('div');
      text.className = 'history-text';
      text.textContent = entry.message;
      const meta = document.createElement('div');
      meta.className = 'history-meta';
      meta.textContent = entry.time + ' · Session ' + entry.session;
      main.appendChild(text); main.appendChild(meta);
      const badge = document.createElement('span');
      badge.className = 'badge ' + badgeClass(entry.status);
      badge.textContent = badgeLabel(entry);
      row.appendChild(main); row.appendChild(badge);
      historyList.appendChild(row);
    });
  }
  clearHistoryBtn.addEventListener('click', function () {
    if (confirm('Clear local scan history on this device? This does not affect the spreadsheet.')) {
      saveHistoryList([]);
      renderHistory();
    }
  });

  // ---- Server-side scan log ----
  loadLogBtn.addEventListener('click', function () {
    loadLogBtn.disabled = true;
    loadLogBtn.textContent = 'Loading...';
    const filters = {
      session: filterSession.value,
      status: filterStatus.value,
      admin: filterAdmin.value.trim(),
      studentId: filterStudent.value.trim()
    };
    apiCall({ action: 'getLogs', filters: filters })
      .then(function (res) {
        loadLogBtn.disabled = false;
        loadLogBtn.textContent = 'Load Log';
        logList.innerHTML = '';
        if (!res.ok) { emptyLog.textContent = res.message || 'Could not load log.'; emptyLog.classList.remove('hidden'); logMeta.textContent = ''; return; }
        emptyLog.classList.toggle('hidden', res.logs.length > 0);
        emptyLog.textContent = 'No matching scans.';
        res.logs.forEach(function (log) {
          const row = document.createElement('div');
          row.className = 'history-item';
          const main = document.createElement('div');
          main.className = 'history-main';
          const text = document.createElement('div');
          text.className = 'history-text';
          text.textContent = (log.name || log.id) + ' (' + log.id + ') — by ' + log.admin;
          const meta = document.createElement('div');
          meta.className = 'history-meta';
          meta.textContent = log.time + ' · Session ' + log.session;
          main.appendChild(text); main.appendChild(meta);
          const badge = document.createElement('span');
          const cls = log.status === 'Present' ? 'badge-success' : (log.status === 'Already Present' ? 'badge-warning' : 'badge-error');
          badge.className = 'badge ' + cls;
          badge.textContent = log.status.toLowerCase();
          row.appendChild(main); row.appendChild(badge);
          logList.appendChild(row);
        });
        logMeta.textContent = 'Showing ' + res.logs.length + ' of ' + res.total + ' matching scan(s), most recent first.';
      })
      .catch(function () {
        loadLogBtn.disabled = false;
        loadLogBtn.textContent = 'Load Log';
        logMeta.textContent = 'Could not reach the server.';
      });
  });

  // ---- Offline queue ----
  function getQueue() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return []; } }
  function setQueue(q) { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }
  function queueScan(payload) { const q = getQueue(); q.push(payload); setQueue(q); updateQueueNote(); }
  function updateQueueNote() {
    const q = getQueue();
    if (q.length === 0) { queueNote.classList.add('hidden'); return; }
    queueNote.classList.remove('hidden');
    queueNote.textContent = q.length + ' scan(s) queued offline — will sync automatically.';
  }
  function flushQueue() {
    if (!checkConfigured()) return;
    const q = getQueue();
    if (q.length === 0) return;
    const remaining = [];
    let chain = Promise.resolve();
    q.forEach(function (payload) {
      chain = chain.then(function () {
        return apiCall(payload)
          .then(function (res) { if (!(res && res.ok)) remaining.push(payload); })
          .catch(function () { remaining.push(payload); });
      });
    });
    chain.then(function () { setQueue(remaining); updateQueueNote(); });
  }
  setInterval(flushQueue, 8000);
  window.addEventListener('online', flushQueue);

  // ---- Session confirmation flow ----
  confirmBtn.addEventListener('click', function () {
    if (!checkConfigured()) return;
    confirmedSession = sessionSelect.value;
    localStorage.setItem('attendanceLastSession', confirmedSession);

    sessionCard.classList.add('hidden');
    activeBanner.classList.remove('hidden');
    scanCard.classList.remove('hidden');
    activeSessionLabel.textContent = 'Session ' + confirmedSession;

    presentCount = 0; totalCount = 0;
    counterSpan.textContent = '...';
    apiCall({ action: 'count', session: confirmedSession })
      .then(function (res) {
        if (res.ok) { presentCount = res.present; totalCount = res.total; }
        counterSpan.textContent = presentCount + ' / ' + totalCount;
      })
      .catch(function () { counterSpan.textContent = '–/–'; });
  });

  changeSessionBtn.addEventListener('click', function () {
    if (cameraRunning) {
      html5QrCode.stop().catch(function () {});
      cameraRunning = false;
      startBtn.classList.remove('hidden');
      stopBtn.classList.add('hidden');
    }
    confirmedSession = null;
    sessionCard.classList.remove('hidden');
    activeBanner.classList.add('hidden');
    scanCard.classList.add('hidden');
    showResult('idle', 'Waiting to scan...');
  });

  // ---- Scanning ----
  function processCode(decodedText, allowRepeat) {
    const now = Date.now();
    const key = decodedText + '|' + confirmedSession;
    if (!allowRepeat && key === lastCode && (now - lastTime) < 3000) return;
    lastCode = key; lastTime = now;

    if (!checkConfigured()) return;
    const admin = getAdmin();
    if (!admin) { showResult('error', 'Not logged in.'); return; }

    showResult('idle', 'Checking...');
    const payload = { id: decodedText, session: confirmedSession, admin: admin.name };
    const timeLabel = new Date().toLocaleTimeString();

    apiCall(payload)
      .then(function (res) {
        const cls = res.ok ? (res.alreadyMarked ? 'warning' : 'success') : 'error';
        showResult(cls, res.message);
        addHistoryEntry({ time: timeLabel, session: confirmedSession, message: res.message, status: cls, queued: false });
        if (res.ok && !res.alreadyMarked) { presentCount += 1; counterSpan.textContent = presentCount + ' / ' + totalCount; }
      })
      .catch(function () {
        queueScan(payload);
        const msg = 'Offline — ID ' + decodedText + ' queued for Session ' + confirmedSession;
        showResult('warning', msg);
        addHistoryEntry({ time: timeLabel, session: confirmedSession, message: msg, status: 'warning', queued: true });
      });
  }

  startBtn.addEventListener('click', function () {
    showResult('idle', 'Requesting camera access...');
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      function (decodedText) { processCode(decodedText, false); }
    ).then(function () {
      cameraRunning = true;
      startBtn.classList.add('hidden');
      stopBtn.classList.remove('hidden');
      showResult('idle', 'Point camera at a student QR code');
    }).catch(function (err) {
      showResult('error', 'Camera error: ' + err + ' (try Upload QR Image instead)');
    });
  });

  stopBtn.addEventListener('click', function () {
    if (cameraRunning) {
      html5QrCode.stop().then(function () {
        cameraRunning = false;
        startBtn.classList.remove('hidden');
        stopBtn.classList.add('hidden');
        showResult('idle', 'Camera stopped');
      });
    }
  });

  uploadBtn.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;
    showResult('idle', 'Reading image...');
    html5QrCode.scanFile(file, true)
      .then(function (decodedText) { processCode(decodedText, true); })
      .catch(function (err) { showResult('error', 'Could not read QR from image: ' + err); });
  });

  // ---- Init ----
  checkConfigured();
  updateQueueNote();
  const existingAdmin = getAdmin();
  if (existingAdmin) { showLoggedInUI(existingAdmin); } else { showLoggedOutUI(); }
</script>
</body>
</html>
